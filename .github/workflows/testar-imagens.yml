name: Testar geração de imagens

# Teste rápido da chave do Pollinations (ou de outro provedor): gera cenas e slides de
# exemplo, sem usar Claude nem publicar nada. As imagens ficam em "Artifacts".
# Roda sozinho a cada atualização do branch de desenvolvimento (testa 3 mundos visuais)
# e, depois que estiver no main, também pelo botão "Run workflow" (1 mundo à escolha).
on:
  push:
    branches: [claude/instagram-automated-assistant-or6d93]
  workflow_dispatch:
    inputs:
      mundo:
        description: "Mundo visual"
        type: choice
        options: [aquarela, xilogravura, oleo_renascentista, fotografia_noturna, noir_pb,
                  colagem_diorama, vetor_flat, risografia, claymation]
        default: aquarela

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar imagem de teste
        id: teste
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          MUNDOS: ${{ inputs.mundo || 'aquarela risografia xilogravura' }}
        run: |
          falhas=0
          for mundo in $MUNDOS; do
            python -m assistente testar-imagem --mundo "$mundo" || falhas=$((falhas + 1))
          done
          exit $falhas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-imagem
          path: posts/_teste/
          if-no-files-found: warn
