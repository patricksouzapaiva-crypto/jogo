# Trecho de configuração do Jarvis para o Hermes Agent.
#
# Os scripts de instalação já aplicam os valores simples (approvals.mode, terminal.cwd).
# As listas abaixo precisam ser coladas à mão: rode `hermes config edit` e junte cada bloco
# ao que já existir no seu config.yaml (não duplique as chaves `approvals:`, `skills:` etc.).

approvals:
  mode: smart                 # um modelo barato avalia comandos arriscados; os perigosos são negados ou perguntados
  denial_breaker_threshold: 3 # depois de 3 negativas seguidas, o agente para e pede ajuda
  deny:                       # bloqueados sempre, mesmo no modo --yolo
    - "git push --force*"
    - "git push -f*"
    - "git reset --hard*"
    - "git clean -*"
    - "rm -rf /*"
    - "rm -rf ~*"
    - "*format c:*"
    - "*Remove-Item*-Recurse*C:\\*"
    - "*curl*|*sh*"
    - "*--dangerously-skip-permissions*"
  smart_policy: |
    APROVE comandos de leitura e de build dentro da pasta do projeto do jogo (git status/diff/log/add/commit,
    godot --headless, claude -p, ls, cat, grep).
    ESCALE para o usuário qualquer comando que apague arquivos fora do projeto, instale programas,
    mexa em configurações do sistema, acesse banco/pagamentos ou envie dados para serviços desconhecidos.

# Cérebro grátis: o principal é o Nous Portal (configurado com `hermes setup --portal`).
# Quando ele bater no limite, o Hermes passa sozinho para a reserva do OpenRouter.
# O jeito mais fácil de criar a reserva é `hermes fallback add` (escolha OpenRouter e um modelo
# terminado em ":free"; a lista está em https://openrouter.ai/models?max_price=0).
# Se preferir editar à mão, troque o modelo abaixo por um ":free" da lista e tire os "#":
# fallback_providers:
#   - provider: openrouter
#     model: "<nome-do-modelo>:free"
fallback:
  min_switch_reset_seconds: 120   # se o limite libera em menos de 2 min, espera em vez de trocar

# As skills do jogo são copiadas pelo instalador para <HERMES_HOME>/skills/jogo/ e não precisam de config.

# Exemplo de servidor MCP do Godot (opcional, comunidade). Permite ao agente rodar o projeto,
# ver a árvore de cenas e ler erros do console. Requer Node.js.
# mcp_servers:
#   godot:
#     command: npx
#     args: ["-y", "@coding-solo/godot-mcp"]
#     env:
#       GODOT_PATH: "C:/Godot/Godot_v4.4-stable_win64_console.exe"   # ajuste para o seu caminho

# ---------------------------------------------------------------------------
# VOZ: você diz "Jarvis", fala o pedido e ele responde falando, em português.
# Tudo grátis. Só a palavra "jarvis" precisa de uma chave grátis da Picovoice
# (https://console.picovoice.ai). Salve com: hermes config set PORCUPINE_ACCESS_KEY <chave>
# Sem a chave, troque provider para "auto" e chame com "hey hermes".
# ---------------------------------------------------------------------------
wake_word:
  enabled: true
  provider: porcupine        # o modelo "jarvis" já vem pronto nele
  porcupine:
    keyword: jarvis
  sensitivity: 0.6           # suba para 0.7-0.8 se ele acordar sozinho com barulho
  start_new_session: false   # continua a mesma conversa (ele lembra do que vocês falaram)

stt:                         # ouvir: transcrição local, grátis, roda no processador
  provider: local
  language: "pt"
  local:
    model: small             # "base" se ficar lento; "small" entende melhor português

tts:                         # falar: voz da Microsoft (Edge), grátis, precisa de internet
  provider: edge
  edge:
    voice: "pt-BR-AntonioNeural"   # voz feminina: "pt-BR-FranciscaNeural"

voice:
  auto_tts: true             # responde falando quando o modo voz está ligado
  silence_duration: 2.0      # segundos de silêncio para ele entender que você terminou

display:
  language: pt               # mensagens do sistema em português
