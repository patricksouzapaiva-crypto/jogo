# Trecho de configuração do Jarvis para o Hermes Agent.
#
# Os scripts de instalação já aplicam os valores simples (approvals.mode, terminal.cwd).
# As listas abaixo precisam ser coladas à mão: rode `hermes config edit` e junte cada bloco
# ao que já existir no seu config.yaml (não duplique as chaves `approvals:`, `skills:` etc.).

approvals:
  mode: smart                 # um modelo barato avalia comandos arriscados; os perigosos são negados ou perguntados
  denial_breaker_threshold: 3 # depois de 3 negativas seguidas, o agente para e pede ajuda
  deny:                       # bloqueados sempre, mesmo no modo --yolo
    - "git push --force*"
    - "git push -f*"
    - "git reset --hard*"
    - "git clean -*"
    - "rm -rf /*"
    - "rm -rf ~*"
    - "*format c:*"
    - "*Remove-Item*-Recurse*C:\\*"
    - "*curl*|*sh*"
    - "*--dangerously-skip-permissions*"
  smart_policy: |
    APROVE comandos de leitura e de build dentro da pasta do projeto do jogo (git status/diff/log/add/commit,
    godot --headless, claude -p, ls, cat, grep).
    ESCALE para o usuário qualquer comando que apague arquivos fora do projeto, instale programas,
    mexa em configurações do sistema, acesse banco/pagamentos ou envie dados para serviços desconhecidos.

# As skills do jogo são copiadas pelo instalador para <HERMES_HOME>/skills/jogo/ e não precisam de config.

